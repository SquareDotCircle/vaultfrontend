<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI Superintelligence Cloud - Go Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=SF+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--primary-bg);
            font-family: var(--font-sans);
        }

        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .controls-panel {
            position: absolute;
            top: var(--space-xl);
            left: var(--space-xl);
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            pointer-events: auto;
            min-width: 280px;
        }

        .controls-title {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--accent-primary);
            margin-bottom: var(--space-md);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .control-group {
            margin-bottom: var(--space-lg);
        }

        .control-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: var(--space-sm);
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .control-buttons {
            display: flex;
            gap: var(--space-xs);
            flex-wrap: wrap;
        }

        .control-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.625rem;
            font-weight: 500;
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            pointer-events: auto;
        }

        .control-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-1px);
        }

        .control-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: var(--primary-bg);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.3);
        }

        .control-slider {
            width: 100%;
            margin: var(--space-sm) 0;
        }

        .slider-input {
            width: 100%;
            height: 4px;
            background: var(--surface);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-input::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }

        .slider-input::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }

        .slider-value {
            font-family: var(--font-mono);
            font-size: 0.625rem;
            color: var(--accent-primary);
            margin-left: var(--space-sm);
        }

        .stats-panel {
            position: absolute;
            bottom: var(--space-xl);
            left: var(--space-xl);
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            pointer-events: auto;
            font-family: var(--font-mono);
            font-size: 0.625rem;
            color: var(--text-tertiary);
        }

        .capture-zone {
            position: absolute;
            bottom: var(--space-xl);
            right: var(--space-xl);
            width: 120px;
            height: 120px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border: 2px dashed var(--border-subtle);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .capture-zone.active {
            border-color: var(--accent-primary);
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.3);
            transform: scale(1.1);
        }

        .capture-icon {
            font-size: 2rem;
            margin-bottom: var(--space-xs);
        }

        .capture-label {
            font-family: var(--font-mono);
            font-size: 0.625rem;
            color: var(--text-secondary);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .capture-count {
            font-family: var(--font-mono);
            font-size: 0.5rem;
            color: var(--accent-primary);
            margin-top: var(--space-xs);
        }

        .instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-tertiary);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            pointer-events: none;
            opacity: 0.7;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .back-nav {
            position: absolute;
            top: var(--space-xl);
            right: var(--space-xl);
            pointer-events: auto;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 500;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .back-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .controls-panel {
                top: var(--space-md);
                left: var(--space-md);
                right: var(--space-md);
                min-width: auto;
                padding: var(--space-md);
            }

            .stats-panel {
                bottom: var(--space-md);
                left: var(--space-md);
                font-size: 0.5rem;
            }

            .capture-zone {
                bottom: var(--space-md);
                right: var(--space-md);
                width: 80px;
                height: 80px;
            }

            .capture-icon {
                font-size: 1.5rem;
            }

            .back-nav {
                top: var(--space-md);
                right: var(--space-md);
            }

            .instructions {
                font-size: 0.75rem;
                padding: 0 var(--space-lg);
            }
        }
    </style>
</head>
<body>
    <div id="three-container"></div>
    
    <div class="ui-overlay">
        <div class="controls-panel">
            <div class="controls-title">AI Network Control</div>
            
            <div class="control-group">
                <label class="control-label">Interaction Mode</label>
                <div class="control-buttons">
                    <button class="control-btn active" data-mode="orbit">Orbit</button>
                    <button class="control-btn" data-mode="attract">Attract</button>
                    <button class="control-btn" data-mode="repel">Repel</button>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Visual Style</label>
                <div class="control-buttons">
                    <button class="control-btn active" data-style="nodes">Nodes</button>
                    <button class="control-btn" data-style="connections">Connections</button>
                    <button class="control-btn" data-style="both">Both</button>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Particle Count: <span class="slider-value" id="particleCount">1000</span></label>
                <input type="range" class="slider-input" id="particleSlider" min="500" max="3000" value="1000" step="100">
            </div>

            <div class="control-group">
                <label class="control-label">Connection Distance: <span class="slider-value" id="connectionDistance">50</span></label>
                <input type="range" class="slider-input" id="distanceSlider" min="20" max="100" value="50" step="5">
            </div>

            <div class="control-group">
                <label class="control-label">Animation Speed: <span class="slider-value" id="animSpeed">1.0</span></label>
                <input type="range" class="slider-input" id="speedSlider" min="0.1" max="3.0" value="1.0" step="0.1">
            </div>
        </div>

        <div class="stats-panel">
            <div>FPS: <span id="fps">60</span></div>
            <div>Particles: <span id="particleStats">1000</span></div>
            <div>Connections: <span id="connectionStats">0</span></div>
            <div>Captured: <span id="capturedStats">0</span></div>
        </div>

        <div class="capture-zone" id="captureZone">
            <div class="capture-icon">🔒</div>
            <div class="capture-label">Your Vault</div>
            <div class="capture-count"><span id="capturedCount">0</span> AI Nodes</div>
        </div>

        <div class="instructions">
            <div>🖱️ Drag to rotate • 🖱️ Right-click drag to capture nodes</div>
            <div>⚡ Experience the power of superintelligence visualization</div>
        </div>

        <div class="back-nav">
            <a href="index.html" class="back-btn">← Back to Main</a>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Wait for Three.js to load, then start our app
        window.addEventListener('load', () => {
            console.log('Page loaded, THREE available:', !!window.THREE);
            console.log('OrbitControls available:', !!window.THREE?.OrbitControls);
        });
    </script>
    <script src="network-3d.js"></script>
</body>
</html>
