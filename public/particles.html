<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Particle Cloud</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #ffaa00;
        }
        
        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            z-index: 100;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
        }
        
        button {
            background: transparent;
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #ffaa00;
            color: #000;
        }
        
        button.active {
            background: #ffaa00;
            color: #000;
        }
        
        input[type="range"] {
            width: 120px;
            margin-left: 10px;
        }
        
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            font-size: 10px;
            line-height: 1.4;
        }
        
        .back-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffaa00;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #ffaa00;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .back-link:hover {
            background: #ffaa00;
            color: #000;
        }
        
        @media (max-width: 768px) {
            .controls {
                top: 10px;
                left: 10px;
                right: 10px;
                padding: 10px;
            }
            
            .button-group {
                flex-wrap: wrap;
            }
            
            .info {
                bottom: 10px;
                left: 10px;
                right: 10px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="controls">
        <div class="control-group">
            <label>Mode:</label>
            <div class="button-group">
                <button id="orbit-btn" class="active">Orbit</button>
                <button id="attract-btn">Attract</button>
                <button id="repel-btn">Repel</button>
            </div>
        </div>
        
        <div class="control-group">
            <label>Style:</label>
            <div class="button-group">
                <button id="particles-btn" class="active">Particles</button>
                <button id="lines-btn">Lines</button>
                <button id="both-btn">Both</button>
            </div>
        </div>
        
        <div class="control-group">
            <label>Count: <span id="count-value">1000</span></label>
            <input type="range" id="count-slider" min="200" max="3000" value="1000" step="100">
        </div>
        
        <div class="control-group">
            <label>Speed: <span id="speed-value">1.0</span></label>
            <input type="range" id="speed-slider" min="0.1" max="3.0" value="1.0" step="0.1">
        </div>
    </div>
    
    <div class="info">
        <div>🖱️ Drag to rotate • 🔥 Right-click to interact</div>
        <div>FPS: <span id="fps">60</span> | Particles: <span id="particle-count">1000</span></div>
    </div>
    
    <a href="index.html" class="back-link">← Back</a>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js"></script>
    <script src="particles.js"></script>
</body>
</html>
